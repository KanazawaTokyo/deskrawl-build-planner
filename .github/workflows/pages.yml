name: Test and deploy Deskrawl Build Planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify equipment and build calculations
        run: |
          node --version
          node test.js
          node test-gems.js
          node test-cloud.js
          node test-lock.js
          node test-sets.js
          node test-required-ops.js
          node test-affix-pools.js
          node test-paragon.js
          node test-pets.js
          node test-combat.js
          node test-runes.js
          node test-talents.js
          node test-unique-effects.js
          node test-stats-view.js
          node test-japanese.js
          node test-ai-export.js
          node test-op-optimizer.js
      - name: Build website
        run: node scripts/build.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # GitHub Actions artifact metadata may appear a few seconds after upload completes.
      - name: Wait for Pages artifact indexing
        run: sleep 8
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
