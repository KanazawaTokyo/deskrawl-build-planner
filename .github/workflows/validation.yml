name: Validate Deskrawl changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run all pure-JS regression checks
        shell: bash
        run: |
          set -euo pipefail
          for file in test.js test-gems.js test-cloud.js test-lock.js test-sets.js test-equipment-workflow.js test-input-review.js test-rankings.js test-required-ops.js test-affix-pools.js test-paragon.js test-pets.js test-combat.js test-runes.js test-talents.js test-unique-effects.js test-stats-view.js test-japanese.js test-ai-export.js test-op-optimizer.js test-dps-sim.js test-combat-engine.js test-simulation-v2.js; do
            echo "Running $file"
            node "$file"
          done
      - name: Ensure static production build compiles
        run: node scripts/build.js
