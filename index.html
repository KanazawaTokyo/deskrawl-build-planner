function renderComparison(current,candidate){if(!current||!candidate)return `<div class="empty">現在装備と候補を登録すると比較できます。</div>`;const same=candidate.id===current.id;const lev=ui.compareMode==='equal'?ui.equalLevel:undefined;const a=C.itemTotal(current,lev),b=C.itemTotal(candidate,lev),get=(arr,key)=>arr.filter(x=>x.stat===key).reduce((t,v)=>t+v.value,0);const keys=[...new Set([...a,...b].map(x=>x.stat))];const before=C.calc(state,build(),{equalLevel:lev});const after=C.calc(state,build(),{slot:ui.slot,itemId:candidate.id,equalLevel:lev});return `<div class="card compare-card"><div class="card-heading"><div><h2>装備候補の比較</h2><span>確定前にOP・ステータスを同時に比較</span></div><span class="tag amber">未校正値を含む</span></div><div class="comparison-controls"><div class="segmented"><button data-action="compare-equal" class="${ui.compareMode==='equal'?'active':''}">同じ強化段階</button><button data-action="compare-actual" class="${ui.compareMode==='actual'?'active':''}">現在の強化値</button></div>${ui.compareMode==='equal'?`<label class="field tiny"><span>比較条件</span><select data-change="equalLevel">${Array.from({length:13},(_,i)=>opt(i,stage(i),ui.equalLevel)).join('')}</select></label>`:''}</div><div class="compare-columns"><div class="compare-item"><small>現在装備</small><b>${E(titleOf(current))}</b><span>${ui.compareMode==='equal'?stage(ui.equalLevel):current.upgradeKnown?stage(current.upgrade):'強化未確認'}</span></div><div class="compare-icon">↔</div><div class="compare-item"><small>比較候補</small><b>${E(titleOf(candidate))}</b><span>${ui.compareMode==='equal'?stage(ui.equalLevel):candidate.upgradeKnown?stage(candidate.upgrade):'強化未確認'}</span></div></div>${same?'<div class="notice">現在装備と同じ個体を比較しています。下の保管庫から別の候補を選んでください。</div>':''}<h3 class="table-heading">① OPごとの差分</h3><div class="data-table">${keys.map(key=>{const old=get(a,key),next=get(b,key),delta=next-old;return `<div class="data-row"><div><strong>${E(D.affixes[key]?.[0]||C.labels[key]||key)}</strong><span>${E(C.format(key,old))} → ${E(C.format(key,next))}</span></div><b class="${delta>0?'positive':delta<0?'negative':'neutral'}">${delta>0?'+':''}${E(C.format(key,delta))}</b></div>`}).join('')||'<p class="muted">比較できる数値はありません</p>'}</div><h3 class="table-heading">①-b 宝石の差分（最高Tier 6）</h3><div class="data-table">${renderGemComparison(current,candidate)}</div><h3 class="table-heading">② キャラクターステータスへの影響</h3><div class="data-table">${C.full.filter(key=>Math.abs((after.raw[key]||0)-(before.raw[key]||0))>.001).map(key=>{const delta=C.delta(key,before.raw[key],after.raw[key]);return `<div class="data-row"><div><strong>${E(C.labels[key]||key)}</strong><span>${E(C.format(key,before.raw[key]||0))} → ${E(C.format(key,after.raw[key]||0))}</span></div><b class="${delta>0?'positive':delta<0?'negative':'neutral'}">${delta>0?'+':''}${E(C.format(key,delta))}</b></div>`}).join('')||'<p class="muted">計算可能な差分はありません。</p>'}</div><div class="notice gentle">同一強化段階の比較を標準表示します。Black Mistと現在のDivine 4部位の固定数値は公開データを参照し、強化ステップを試算しています。端数処理は暫定です。固有効果の条件付きダメージや未登録ステータスは最終値に含まれません。比較差分は<b>完全な最終性能ではなく登録情報からの部分計算</b>です。</div>${!same?`<button class="btn wide" data-action="equip" data-id="${candidate.id}">この候補を現在のビルドに装備する</button>`:''}</div>`;}
function renderGemComparison(current,candidate){
 const max=D.gemSocketLimits[current.slot]||0;
 if(!max)return '<div class="data-row"><span>宝石ソケットなし</span></div>';
 const desc=(item,idx)=>{const type=item.gems?.[idx]?.type,e=D.gemEffect(type,item.slot);if(!type)return 'なし';if(!e)return '旧形式・集計外';return D.gems[type].name+'：'+C.labels[e.stat]+' +'+C.format(e.stat,e.value)};
 const rows=[];
 for(let i=0;i<max;i++){const old=desc(current,i),next=desc(candidate,i);if(old!==next)rows.push(`<div class="data-row"><div><strong>ソケット ${i+1}</strong><span>${E(old)} → ${E(next)}</span></div></div>`);}
 return rows.join('')||'<div class="data-row"><span class="muted">宝石の構成は同じです。</span></div>';
}
function slotIcon(x){return {weapon:'⚔',head:'♜',neck:'◇',shoulder:'◆',chest:'▣',gloves:'✦',belt:'▬',legs:'◫',boots:'⌁',ring1:'◌',ring2:'◌'}[x]||'◆'}
function renderStats(){const b=build(),r=C.calc(state,b);return `<main class="workspace stats-workspace"><section class="stats-main"><div class="page-heading"><div class="eyebrow">CHARACTER OVERVIEW</div><h1>キャラクターステータス</h1><p>装備・Paragon・タレント・バフの取得元を確認できます。</p></div><div class="quickbar"><label class="toggle"><input type="checkbox" data-change="aura" ${b.settings?.aura?'checked':''}/><span class="toggle-track"></span><span>Flame Aura <strong>${b.settings?.aura?'ON':'OFF'}</strong></span></label><label class="inline-select">ポーション <select data-change="quickpotion">${potionOptions(b.settings?.potion)}</select></label><button class="btn outline" data-action="settings"><span>⚙</span> ビルド設定</button></div><div class="section-label"><span>重要ステータス</span><span class="muted small">KEY METRICS</span></div><div class="stat-tiles">${C.priority.map(k=>statTile(k,r)).join('')}</div><div class="notice gentle">表示数値は登録されている項目の<b>部分計算</b>です。Divine固定OPは加算済みですが、強化値・基礎値・外部補正の未登録分や、条件付きの固有効果は未計算のため、ゲーム内の完全な最終値ではありません。<button class="inline-link" data-action="measurement">実測値を記録</button></div><div class="section-label extra-space"><span>すべてのステータス</span><span class="muted small">ALL STATISTICS</span></div>${[['攻撃',['int','str','dex','damage','lightning','arcane','physical','fire','cold','poison','thorns','allDamage','healthy','injured','elite','critChance','critDamage','as','cdr']],['防御',['maxHP','bonusHP','armor','mr','critRed','dodge','physicalDR','coldDR','fireDR','lightningDR','arcaneDR','poisonDR']],['リソース・補助',['mana','mcr','move','loh','itemFind','manaKill']]].map(([name,keys])=>`<section class="stat-group"><h3>${name}</h3><div class="stat-rows">${keys.map(k=>`<button data-action="stat" data-value="${k}" class="stat-row ${ui.selectedStat===k?'chosen':''}"><span>${E(C.labels[k])}</span><b>${E(C.format(k,r.effective[k]))}</b><span class="stat-arrow">›</span></button>`).join('')}</div></section>`).join('')}<section class="card snapshot"><div class="card-heading"><div><h2>実測記録</h2><span>過去の測定値は現在の合計に足しません</span></div><button class="text-btn" data-action="measurement">＋ 登録</button></div>${state.measurements.filter(x=>x.buildId===b.id).slice(-3).reverse().map(m=>`<div class="snapshot-row"><strong>${E(m.at)}</strong><span>${Object.entries(m.values||{}).map(([k,v])=>`${C.labels[k]||k}: ${v}`).join(' · ')}</span><small>${E(m.notes||'')}</small></div>`).join('')||'<p class="muted">実測記録はまだありません。</p>'}</section></section><aside class="stats-side ${ui.settingsOpen?'show-settings':''}">${ui.settingsOpen?renderSettings():renderBreakdown(r)}</aside></main>`;}
function statTile(k,r){const val=r.effective[k];const cap=D.limits[k];return `<button class="stat-tile ${ui.selectedStat===k&&!ui.settingsOpen?'chosen':''}" data-action="stat" data-value="${k}"><span class="stat-label">${E(C.labels[k])}</span><strong>${E(C.format(k,val))}</strong><span class="stat-hint">${cap?`上限 ${cap}%${r.raw[k]>cap?' · 超過 '+C.format(k,r.raw[k]-cap):''}`:k==='mr'?'Armorとは別計算':'実効値・部分合計'}</span>${cap?`<div class="progress"><i style="width:${Math.min(100,Math.max(0,(val||0)/cap*100))}%"></i></div>`:''}</button>`}
function renderBreakdown(r){const k=ui.selectedStat,list=r.breakdown[k]||[],raw=r.raw[k],eff=r.effective[k];return `<div class="side-panel"><div class="side-title"><div><small>STAT BREAKDOWN</small><h2>${E(C.labels[k]||k)}</h2></div><button class="icon-btn" data-action="settings" title="設定パネル">⚙</button></div><div class="side-total"><span>登録データからの計算値</span><strong>${E(C.format(k,eff))}</strong>${raw!==eff?`<small>上限適用前 ${E(C.format(k,raw))}</small>`:''}</div><h3>取得元内訳</h3>${list.length?list.map(x=>`<div class="break-row"><div><span>${E(x.source)}</span><small>${E(qualityOf(x.quality))}</small></div><strong>+${E(C.format(k,x.value))}</strong></div>`).join(''):'<div class="notice">この項目の取得元は未登録です。ビルド設定か装備を入力してください。</div>'}${k==='mr'||k==='armor'?`<div class="mitigation"><span>敵Lv ${E(build().settings?.enemyLevel||70)} の推定軽減率</span><strong>${E(r.mitigations[k].toFixed(1))}%</strong><small>式：防御値 ÷（防御値 + 50 × 敵Lv）。登録値のみで計算した参考値。</small></div>`:''}<button class="btn outline wide" data-action="settings">設定を編集 <span>→</span></button><p class="side-note">${r.pending.length}件の未校正項目があります。確度の低い数値を最終値として扱わないでください。</p></div>`;}
function potionOptions(current){return [['none','なし'],['swift','上級迅速（AS）'],['vitality','上級活力（HP）'],['resistance','上級耐性（MR）'],['wind','風（Dodge）'],['focus','上級集中（CDR）'],['efficiency','上級効率（MCR）'],['cruel','上級残酷（Crit）']].map(x=>opt(x[0],x[1],current)).join('')}
function renderSettings(){const b=build(),s=b.settings||{},p=s.paragon||{},t=s.talents||{},pet=s.pet||{};let body='';if(ui.settingsTab==='paragon')body=`<p class="helper">ポイント数を入力します。ゲーム内の補正が不確かな場合は実測値を優先してください。</p>${[['bonusMR','Bonus Magic Resist（%）'],['bonusArmor','Bonus Armor（%）'],['bonusHP','Bonus HP（%）'],['maxMana','最大Mana +'],['as','Attack Speedボーナス（%）']].map(([k,label])=>settingNumber('paragon.'+k,label,p[k]||0)).join('')}`;
else if(ui.settingsTab==='talents')body=`<p class="helper">習得レベルはビルドごとに保存。AuraのON/OFFは上のショートカットと同期します。</p>${settingNumber('talents.flameWard','炎の加護（0〜8）',t.flameWard||0,0,8)}${settingNumber('talents.arcaneReservoir','魔力の貯蔵（0〜8）',t.arcaneReservoir||0,0,8)}<label class="checkbox-row"><input type="checkbox" data-change="aura" ${s.aura?'checked':''}/> Flame Aura発動中</label><label class="field"><span>敵レベル（軽減率用）</span><input type="number" min="1" max="999" data-change="enemyLevel" value="${E(s.enemyLevel||70)}"></label>`;
else if(ui.settingsTab==='pet')body=`<label class="field"><span>使用ミニオン</span><select data-change="petId">${[['unknown','未確認／未設定'],['raptor','ラプター'],['emberfang','炎牙'],['wyrm','汚された古竜'],['naga','浅瀬のナーガ'],['other','その他']].map(x=>opt(x[0],x[1],pet.id||'unknown')).join('')}</select></label>${settingNumber('pet.level','強化レベル（0〜10）',pet.level||0,0,10)}<label class="field"><span>継承スキル（任意）</span><select data-change="inherit">${[['','なし／未確認'],['ember','炎牙の燃焼ブレス'],['strong','強攻撃ダメージ'],['vulnerable','脆弱付与'],['other','その他']].map(x=>opt(x[0],x[1],pet.inherit||'')).join('')}</select></label><div class="notice">ミニオン効果の一部は未検証です。固有効果・継承は保存できますが、計算対象外の項目があります。</div>`;
else if(ui.settingsTab==='consumables')body=`<label class="field"><span>戦闘ポーション</span><select data-change="quickpotion">${potionOptions(s.potion)}</select></label><label class="field"><span>料理</span><select data-change="food">${[['none','なし'],['crab','灰殻のカニ'],['other','その他']].map(x=>opt(x[0],x[1],s.food||'none')).join('')}</select></label><label class="field"><span>ユーティリティ</span><select data-change="utility">${[['none','なし'],['speed','移動速度'],['exp','獲得経験値'],['gold','ゴールド']].map(x=>opt(x[0],x[1],s.utility||'none')).join('')}</select></label>`;
else if(ui.settingsTab==='base')body=`<p class="helper">装備外の基礎値のみ入力してください。ゲーム内の最終値を入れると二重計上になります。わからない項目は空欄のままで大丈夫です。</p>${[['int','知力（装備外）'],['mr','Magic Resist（装備外）'],['armor','Armor（装備外）'],['maxHP','最大HP（装備外）'],['critChance','Crit率（装備外）'],['critRed','CritRed（装備外）'],['cdr','CDR（装備外）'],['mcr','MCR（装備外）'],['dodge','Dodge（装備外）'],['mana','最大Mana（装備外）']].map(([k,label])=>settingNumber('base.'+k,label,s.base?.[k]??'')).join('')}`;
return `<div class="side-panel settings-panel"><div class="side-title"><div><small>BUILD CONFIGURATION</small><h2>ビルド設定</h2></div><button class="icon-btn" data-action="close-settings">×</button></div><label class="field"><span>設定項目</span><select id="settingsCategory">${[['paragon','Paragon'],['talents','タレント'],['pet','ミニオン・継承'],['consumables','ポーション・料理'],['base','装備外の基礎値']].map(x=>opt(x[0],x[1],ui.settingsTab)).join('')}</select></label><div class="setting-form">${body}</div><div class="notice gentle">設定変更はこのビルドだけに反映。共有装備は別ビルドでも使用できます。</div></div>`;}
function settingNumber(key,label,value,min=0,max=9999){return `<label class="field"><span>${E(label)}</span><input type="number" min="${min}" max="${max}" step="any" data-change="setting" data-key="${E(key)}" value="${E(value)}" /></label>`;}
function renderModal(){if(!ui.modal)return '';let content='';if(ui.modal==='cloud')content=`<div class="modal-title"><h2>クラウド同期・GitHubログイン</h2><button data-action="modal-close" class="icon-btn">×</button></div><p class="helper">Supabaseの専用プロジェクトを接続すると、GitHubでログインしてPC・スマホのデータを同期できます。接続前もブラウザ内で自動保存されます。</p><label class="field"><span>Supabase Project URL</span><input id="cloudUrl" placeholder="https://xxxx.supabase.co" value="${E(cloudCfg?.url||'')}"></label><label class="field"><span>Publishable / anon key（公開用キーのみ）</span><input id="cloudKey" placeholder="sb_publishable_..." value="${E(cloudCfg?.key||'')}"></label><div class="notice"><b>セキュリティ</b><p>service_role・secretキーは絶対に入力しないでください。保存先のテーブルにはRLSが必要です。</p></div><div class="modal-actions"><button class="btn outline" data-action="cloud-config-save">接続設定を保存</button>${session?`<button class="btn" data-action="cloud-signout">ログアウト</button>`:`<button class="btn" data-action="cloud-login" ${!cloudCfg?.url?'disabled':''}>GitHubでログイン</button>`}</div>${session?`<p class="helper">ログイン中 · ${E(session.user?.email||session.user?.id||'認証済み')}</p><button class="text-btn" data-action="cloud-pull">クラウドから再読み込み</button>`:''}`;
if(ui.modal==='measurement'){const date=new Date().toISOString().slice(0,10);content=`<div class="modal-title"><h2>ゲーム内実測を記録</h2><button data-action="modal-close" class="icon-btn">×</button></div><p class="helper">Aura等の状態と装備構成のスナップショットとして保存。予測値への無条件加算はしません。</p><label class="field"><span>測定日</span><input id="measurementDate" type="date" value="${date}"/></label><div class="measure-grid">${[['critChance','Crit率 %'],['critRed','CritRed %'],['cdr','CDR %'],['mcr','MCR %'],['dodge','Dodge %'],['mr','Magic Resist'],['armor','Armor'],['maxHP','最大HP'],['as','AS'],['mana','最大Mana']].map(([k,l])=>`<label class="field"><span>${l}</span><input type="number" step="any" id="measure-${k}" placeholder="任意"/></label>`).join('')}</div><label class="field"><span>測定メモ</span><input id="measurementMemo" placeholder="Aura ON、ダミー測定など"/></label><div class="modal-actions"><button class="btn" data-action="measurement-save">測定値を保存</button></div>`;}
if(ui.modal==='compare-builds'){const x=state.builds.find(y=>y.id===ui.compareBuildId)||state.builds.find(y=>y.id!==build().id);const a=C.calc(state,build()),b=x?C.calc(state,x):null;content=`<div class="modal-title"><h2>ビルド間比較</h2><button data-action="modal-close" class="icon-btn">×</button></div><label class="field"><span>比較対象</span><select id="otherBuild">${state.builds.filter(z=>z.id!==build().id).map(z=>opt(z.id,z.name,x?.id)).join('')}</select></label>${x?`<div class="compare-columns"><div class="compare-item"><small>現在のビルド</small><b>${E(build().name)}</b></div><div class="compare-icon">↔</div><div class="compare-item"><small>比較対象</small><b>${E(x.name)}</b></div></div><h3 class="table-heading">主要ステータス差分（部分計算）</h3><div class="data-table">${C.priority.map(k=>{const d=(b.raw[k]||0)-(a.raw[k]||0);return `<div class="data-row"><div><strong>${E(C.labels[k])}</strong><span>${C.format(k,a.raw[k]||0)} → ${C.format(k,b.raw[k]||0)}</span></div><b class="${d>0?'positive':d<0?'negative':'neutral'}">${d>0?'+':''}${C.format(k,d)}</b></div>`}).join('')}</div><h3 class="table-heading">装備差分</h3>${D.slots.filter(([s])=>build().loadout[s]!==x.loadout[s]).map(([s,label])=>`<div class="data-row"><strong>${label}</strong><span>${E(titleOf(getItem(build().loadout[s])))} → ${E(titleOf(getItem(x.loadout[s])))}</span></div>`).join('')||'<div class="notice">装備の組み合わせは同一です。Paragon・バフの差などを確認してください。</div>'}`:'<div class="empty">比較できる別ビルドがありません。複製して作成してください。</div>'}<div class="notice gentle">ビルドごとにAura・タレント等の条件が異なる場合、それも含めた比較です。数値は未校正データを含みます。</div>`;}
return `<div class="modal-backdrop" data-action="modal-close"><div class="modal-panel" role="dialog" aria-modal="true" onclick="event.stopPropagation()">${content}</div></div>`;}
// ---------- mutations ----------
function act(action,id,value,el){const b=build();switch(action){
case 'tab-equipment':ui.tab='equipment';ui.settingsOpen=false;render();break;case 'tab-stats':ui.tab='stats';render();break;
case 'slot':ui.slot=value;ui.itemId=null;ui.detail='edit';render();break;
case 'mode-edit':ui.detail='edit';render();break;case 'mode-compare':ui.detail='compare';if(!ui.itemId){const other=state.items.find(i=>i.slot===ui.slot&&i.id!==b.loadout[ui.slot]);ui.itemId=other?.id||b.loadout[ui.slot]}render();break;
case 'select-item':ui.itemId=id;render();break;
case 'new-item':modify(()=>{const template=equipment(ui.slot),x=template?{...template}:{definitionId:'custom-'+ui.slot,slot:ui.slot,primary:[],secondary:'',upgrade:0,gems:[],memo:''};const copy={...x,id:D.uid('item'),primary:[...(x.primary||[])],overrides:{},gems:(x.gems||[]).map(z=>({...z})),nickname:'新しい候補',upgrade:0,upgradeKnown:false,source:'user',owned:null,memo:'',createdAt:new Date().toISOString()};state.items.push(copy);ui.itemId=copy.id;ui.detail='edit'});flash('新しい候補を作成しました');break;
case 'duplicate-item':{const src=getItem(id);if(!src)return;modify(()=>{const cp=JSON.parse(JSON.stringify(src));cp.id=D.uid('item');cp.nickname=(src.nickname||def(src)?.name||'候補')+' のコピー';cp.createdAt=new Date().toISOString();state.items.push(cp);ui.itemId=cp.id;ui.detail='edit'});flash('装備個体を複製しました');break}
case 'equip':{const it=getItem(id);if(!it)return;if(!confirm('「'+titleOf(it)+'」をこのビルドへ装備しますか？\n以前の装備も保管庫に残ります。'))return;modify(()=>{b.loadout[it.slot]=it.id;ui.itemId=it.id;ui.detail='edit'});flash('このビルドの装備を変更しました');break;}
case 'delete-item':{const x=getItem(id);if(!x)return;const n=countRefs(id);if(n){flash(n+'ビルドで参照中のため削除できません。先に装備を外してください。');return}if(!confirm('この装備候補を削除しますか？ この操作は取り消せません。'))return;modify(()=>{state.items=state.items.filter(z=>z.id!==id);ui.itemId=null});break}
case 'compare-equal':ui.compareMode='equal';render();break;case 'compare-actual':ui.compareMode='actual';render();break;
case 'stat':ui.selectedStat=value;ui.settingsOpen=false;render();break;case 'settings':ui.settingsOpen=true;render();break;case 'close-settings':ui.settingsOpen=false;render();break;
case 'new-build':{const name=prompt('新しいビルド名','Stormcaller 新規');if(!name?.trim())return;modify(()=>{const id=D.uid('build');state.builds.push({id,name:name.trim().slice(0,100),loadout:{},settings:defaultSettings(),createdAt:new Date().toISOString()});state.activeBuildId=id;ui.slot='weapon';ui.itemId=null});flash('ビルドを作成しました');break}
case 'duplicate-build':{const name=prompt('複製するビルド名',b.name+' コピー');if(!name?.trim())return;modify(()=>{const cp=JSON.parse(JSON.stringify(b));cp.id=D.uid('build');cp.name=name.trim().slice(0,100);cp.createdAt=new Date().toISOString();state.builds.push(cp);state.activeBuildId=cp.id});flash('装備参照を共有して複製しました');break}
case 'rename-build':{const name=prompt('ビルド名を変更',b.name);if(name?.trim())modify(()=>{b.name=name.trim().slice(0,100)});break}
case 'delete-build':{if(state.builds.length<2){flash('最後のビルドは削除できません');return}if(!confirm('ビルド「'+b.name+'」を削除しますか？ 装備保管庫と測定履歴は残ります。'))return;modify(()=>{state.builds=state.builds.filter(x=>x.id!==b.id);state.activeBuildId=state.builds[0].id;ui.itemId=null});break}
case 'compare-builds':ui.compareBuildId=state.builds.find(x=>x.id!==b.id)?.id||'';ui.modal='compare-builds';render();break;
case 'import':fileInput.click();break;
case 'backup':{const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Deskrawl_Build_Planner_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);flash('バックアップを保存しました');break;}
case 'cloud':ui.modal='cloud';render();break;case 'modal-close':ui.modal='';render();break;
case 'cloud-config-save':{const url=document.getElementById('cloudUrl')?.value.trim().replace(/\/$/,'');const key=document.getElementById('cloudKey')?.value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){flash('有効なSupabase URLと公開用キーを入力してください');return}if(/service_role|sb_secret/i.test(key)){flash('秘密キーは利用できません。公開用キーを使用してください');return}cloudCfg={url,key};localStorage.setItem(CFG,JSON.stringify(cloudCfg));flash('接続設定を保存しました');render();break}
case 'cloud-login':login();break;case 'cloud-signout':signout();break;case 'cloud-pull':pullCloud(true);break;
case 'measurement':ui.modal='measurement';render();break;
case 'measurement-save':{const fields=['critChance','critRed','cdr','mcr','dodge','mr','armor','maxHP','as','mana'];let values={};for(const key of fields){const v=document.getElementById('measure-'+key)?.value;if(v!=='')values[key]=Number(v)}if(!Object.keys(values).length){flash('数値を少なくとも1つ入力してください');return}modify(()=>{state.measurements.push({id:D.uid('measurement'),at:document.getElementById('measurementDate').value,buildId:b.id,values,notes:document.getElementById('measurementMemo').value,loadout:{...b.loadout},settings:JSON.parse(JSON.stringify(b.settings)),createdAt:new Date().toISOString()});ui.modal=''});flash('実測スナップショットを保存しました');break;}
}
}
function defaultSettings(){return {aura:true,enemyLevel:70,paragon:{bonusMR:0,bonusArmor:0,bonusHP:0,maxMana:0,as:0},talents:{flameWard:0,arcaneReservoir:0},pet:{id:'unknown',level:0,inherit:''},potion:'none',food:'none',utility:'none',base:{}}}
function changed(el){const kind=el.dataset.change,b=build(),id=el.dataset.id,it=getItem(id),v=el.type==='checkbox'?el.checked:el.value;
 if(kind==='equalLevel'){ui.equalLevel=Number(v);render();return}
 if(['definition','nickname','upgrade','upgradeKnown','primary','secondary','memo','gem','override'].includes(kind)&&it){if(countRefs(it.id)>1&&!['upgradeKnown'].includes(kind)&&!confirm('この装備は'+countRefs(it.id)+'ビルドで共有されています。変更すると両方に反映されます。続行しますか？')){render();return}modify(()=>{if(kind==='definition'){it.definitionId=v;it.primary=[];it.secondary='';it.overrides={}}else if(kind==='nickname')it.nickname=v.slice(0,120);else if(kind==='upgrade')it.upgrade=Number(v);else if(kind==='upgradeKnown')it.upgradeKnown=v;else if(kind==='primary'){const idx=Number(el.dataset.idx);if(it.primary.includes(v)&&v!==it.primary[idx]&&v){flash('同じOPを2枠に設定できません');return}while(it.primary.length<4)it.primary.push('');it.primary[idx]=v;}else if(kind==='secondary')it.secondary=v;else if(kind==='memo')it.memo=v.slice(0,1000);else if(kind==='override'){it.overrides[itKey(el)]=v===''?null:Number(v)}else if(kind==='gem'){const idx=Number(el.dataset.idx);while(it.gems.length<=idx)it.gems.push({type:''});it.gems[idx]={type:v};}});return;}
 if(kind==='aura'){modify(()=>{b.settings.aura=v});return}if(kind==='quickpotion'){modify(()=>{b.settings.potion=v});return}if(kind==='enemyLevel'){modify(()=>{b.settings.enemyLevel=Math.max(1,Math.min(999,Number(v)||70))});return}
 if(kind==='setting'){const [group,key]=el.dataset.key.split('.');modify(()=>{b.settings[group]??={};b.settings[group][key]=v===''?'':Number(v)});return}
 if(kind==='petId'||kind==='inherit'){modify(()=>{b.settings.pet??={};b.settings.pet[kind==='petId'?'id':'inherit']=v});return}
 if(kind==='food'||kind==='utility')modify(()=>{b.settings[kind]=v});
}
function itKey(el){return el.dataset.key}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const {action,id,value}=el.dataset;if(action==='modal-close'&&e.target.closest('.modal-panel')&&e.target!==el)return;act(action,id,value,el)});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='buildSelect'){state.activeBuildId=el.value;ui.itemId=null;save();return}if(el.id==='settingsCategory'){ui.settingsTab=el.value;render();return}if(el.id==='otherBuild'){ui.compareBuildId=el.value;render();return}if(el.dataset.change)changed(el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal='';render()}});
window.addEventListener('storage',e=>{if(e.key===LS&&e.newValue&&e.newValue!==JSON.stringify(state)){ui.status='conflict';flash('別タブでの変更を検知しました。バックアップを確認してください。');render()}});
// File import control created independently of app render.
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.json,application/json';fileInput.style.display='none';document.body.appendChild(fileInput);fileInput.onchange=async()=>{const file=fileInput.files?.[0];if(!file)return;try{const json=validateState(JSON.parse(await file.text()));if(!confirm('バックアップ内容で現在のビルドデータを置き換えますか？先にバックアップを保存することを推奨します。'))return;state=json;ui.itemId=null;ui.modal='';save();flash('JSONから復元しました')}catch(e){flash('JSONの形式が正しくありません：'+e.message)}finally{fileInput.value=''}};
// Add import via attached global action so that the modal doesn't need an external dependency.
document.addEventListener('click',e=>{const btn=e.target.closest('[data-global-action="import"]');if(btn)fileInput.click()});
// ---------- Supabase native REST cloud adapter (no secret keys or npm required) ----------
function headers(extra={}){return {'apikey':cloudCfg.key,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...extra}}
async function api(path,init={}){const res=await fetch(cloudCfg.url+path,{...init,headers:{...headers(),...(init.headers||{})}});const text=await res.text();let result;try{result=text?JSON.parse(text):null}catch(e){result=text}if(!res.ok)throw Error(typeof result==='object'?result.message||result.error_description||res.statusText:res.status+' '+res.statusText);return result}
async function ensureToken(){if(!session||!cloudCfg)return false;if(Date.now()<session.expiresAt-60000)return true;try{const res=await fetch(cloudCfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!res.ok)throw Error('更新失敗');const j=await res.json();session={...session,access_token:j.access_token,refresh_token:j.refresh_token,expiresAt:Date.now()+j.expires_in*1000};localStorage.setItem(SESSION,JSON.stringify(session));return true}catch(e){ui.status='error';flash('セッション更新に失敗しました。再ログインしてください。');render();return false}}
async function login(){if(!cloudCfg)return flash('Supabase接続情報を入力してください');const redirect=location.origin+location.pathname;location.href=cloudCfg.url+'/auth/v1/authorize?provider=github&redirect_to='+encodeURIComponent(redirect)}
function signout(){session=null;localStorage.removeItem(SESSION);ui.status='local';ui.modal='';render();flash('クラウドからログアウトしました。ローカルデータは残っています。')}
async function initCloud(){if(location.hash.includes('access_token=')){const p=new URLSearchParams(location.hash.slice(1));const access_token=p.get('access_token'),refresh_token=p.get('refresh_token'),expires_in=Number(p.get('expires_in'))||3600;if(access_token&&refresh_token){session={access_token,refresh_token,expiresAt:Date.now()+expires_in*1000};localStorage.setItem(SESSION,JSON.stringify(session));history.replaceState(null,'',location.pathname+location.search);}}
 if(!session||!cloudCfg)return;try{await ensureToken();const user=await api('/auth/v1/user');session.user={id:user.id,email:user.email};localStorage.setItem(SESSION,JSON.stringify(session));await pullCloud(false)}catch(e){ui.status='error';ui.cloudNote=e.message;render();flash('クラウド接続に失敗しました：'+e.message)}}
async function pullCloud(force){if(!session||!cloudCfg)return;try{await ensureToken();const user=session.user||await api('/auth/v1/user');session.user=user;const records=await api('/rest/v1/planner_state?select=payload,revision&user_id=eq.'+encodeURIComponent(user.id));if(records.length){const rec=records[0];validateState(rec.payload);cloudRevision=rec.revision;const differs=JSON.stringify(state)!==JSON.stringify(rec.payload);if((force||differs)&&!confirm('クラウドとローカルのデータが異なります。\nOK：クラウドのデータを読み込む\nキャンセル：ローカルを保持（同期は停止）\n必要なら先にJSONバックアップを保存してください。')){ui.status='conflict';cloudDirty=false;render();flash('ローカルを保持しました。クラウドとの同期は停止中です。');return;}state=rec.payload;localStorage.setItem(LS,JSON.stringify(state));cloudDirty=false;ui.status='synced';ui.modal='';render();flash('クラウドの最新データを読み込みました')}else{cloudRevision=0;cloudDirty=true;await pushCloud();ui.modal='';render();flash('初期データをクラウドに登録しました')}}catch(e){ui.status='error';render();flash('クラウド読込失敗: '+e.message)}}
async function pushCloud(){if(cloudBusy||!cloudDirty||!session||!cloudCfg)return;if(!await ensureToken())return;cloudBusy=true;const snapshot=JSON.stringify(state);try{let data;if(cloudRevision===0){data=await api('/rest/v1/planner_state?select=user_id,revision',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({user_id:session.user.id,payload:state,revision:1})})}else{data=await api('/rest/v1/planner_state?user_id=eq.'+encodeURIComponent(session.user.id)+'&revision=eq.'+cloudRevision+'&select=revision',{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({payload:state,revision:cloudRevision+1})})}if(!data||!data.length){ui.status='conflict';flash('別端末との同期競合。ローカルの変更は残っています。クラウドを再読込する前にJSONバックアップしてください。')}else{cloudRevision=data[0].revision;if(snapshot===JSON.stringify(state)){cloudDirty=false;ui.status='synced'}else{cloudDirty=true;ui.status='saving'}}}catch(e){ui.status='error';flash('クラウド保存失敗。ローカルの変更は残っています: '+e.message)}finally{cloudBusy=false;render();if(cloudDirty&&ui.status==='saving')setTimeout(pushCloud,300)}}
render();initCloud();
// Export a smoke-test object; not a public SDK.
window.DBPApp={getState:()=>JSON.parse(JSON.stringify(state)),getUI:()=>({...ui}),calc:()=>C.calc(state,build())};
})();

</script></body></html>
